name: Ingest Takeout

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC; no-op until a new export shows up on Drive
  workflow_dispatch:
    inputs:
      takeout_url:
        description: "Direct Takeout URL (optional, overrides Drive)"
        required: false
        type: string
      force:
        description: "Re-process the latest Drive export even if it was already ingested"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Fetch Takeout from Drive or URL
        id: fetch
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          TAKEOUT_URL: ${{ inputs.takeout_url }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: bun run scripts/fetch.ts

      - name: Parse Takeout (incremental)
        if: steps.fetch.outputs.skip != 'true'
        run: bun run scripts/parse.ts --input takeout

      - name: Commit updated data
        id: commit
        run: |
          git add site
          if git diff --cached --quiet; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: ingest takeout $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN don't trigger deploy.yml, so deploy from here
  deploy:
    needs: ingest
    if: needs.ingest.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
